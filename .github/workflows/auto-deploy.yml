name: auto-deploy-edgetunnel

on:
  schedule:
    - cron: "37 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-deploy-edgetunnel
  cancel-in-progress: false

env:
  WORKER: edgetunnel-worker
  HOST: yzj666.ccwu.cc
  SUB_TOKEN: 3d72e96b1d3cc29f1f26c764fc5bc50c

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch upstream worker
        run: |
          curl -fsSL https://raw.githubusercontent.com/cmliu/edgetunnel/main/_worker.js -o new_worker.js
          ls -l new_worker.js
          grep -o "const Version = '[^']*'" new_worker.js | head -1 || true

      - name: Sanity check
        run: |
          test "$(wc -c < new_worker.js)" -gt 100000
          cp new_worker.js /tmp/check.mjs
          node --check /tmp/check.mjs

      - name: Build metadata
        env:
          ADMIN_PASS: ${{ secrets.ADMIN_PASS }}
        run: |
          python3 -c "import json,os;print(json.dumps({'main_module':'index.js','compatibility_date':'2025-11-04','bindings':[{'type':'plain_text','name':'ADMIN','text':os.environ['ADMIN_PASS']},{'type':'kv_namespace','name':'KV','namespace_id':'ebddae875f1942e0b5ce500b66bd956e'}]}))" > meta.json

      - name: Deploy to Cloudflare
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          curl -fsS -X PUT "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/workers/scripts/$WORKER" -H "Authorization: Bearer $CF_API_TOKEN" -F "metadata=@meta.json;type=application/json" -F "index.js=@new_worker.js;type=application/javascript+module;filename=index.js"

      - name: Health check
        run: |
          for i in $(seq 1 6); do
            sleep 10
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://$HOST/login" || true)
            sub=$(curl -s "https://$HOST/sub?token=$SUB_TOKEN&b64" | base64 -d | grep -c "vless://" || true)
            echo "try $i: login=$code vless=$sub"
            if [ "$code" = "200" ] && [ "$sub" -gt 0 ]; then
              exit 0
            fi
          done
          echo "::error::health check failed"
          exit 1

      - name: Roll back
        if: failure()
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          curl -fsS -X PUT "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/workers/scripts/$WORKER" -H "Authorization: Bearer $CF_API_TOKEN" -F "metadata=@meta.json;type=application/json" -F "index.js=@_worker.js;type=application/javascript+module;filename=index.js"
          echo "rolled back to repo _worker.js"

      - name: Record deployed version
        if: success()
        run: |
          if cmp -s new_worker.js _worker.js; then exit 0; fi
          cp new_worker.js _worker.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _worker.js
          git commit -m "chore: deploy upstream worker" || true
          git push
