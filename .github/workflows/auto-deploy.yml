name: auto-deploy-edgetunnel

on:
  schedule:
    - cron: "37 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-deploy-edgetunnel
  cancel-in-progress: false

env:
  WORKER: edgetunnel-worker
  HOST: yzj666.ccwu.cc
  SUB_TOKEN: 3d72e96b1d3cc29f1f26c764fc5bc50c

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch upstream worker
        run: |
          curl -fsSL https://raw.githubusercontent.com/cmliu/edgetunnel/main/_worker.js -o new_worker.js
          ls -l new_worker.js
          grep -o "const Version = '[^']*'" new_worker.js | head -1 || true

      - name: Sanity check
        run: |
          test "$(wc -c < new_worker.js)" -gt 100000
          cp new_worker.js /tmp/check.mjs
          node --check /tmp/check.mjs

      # 部署前先抓一份“当前线上字节”，回滚时用它，而不是仓库里的 _worker.js
      # （仓库文件可能因为一次手工热修而和线上不一致）
      - name: Snapshot current deployment
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          if curl -fsS "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/workers/scripts/$WORKER" \
               -H "Authorization: Bearer $CF_API_TOKEN" -o previous_worker.js; then
            echo "snapshot: $(wc -c < previous_worker.js) bytes"
            grep -o "const Version = '[^']*'" previous_worker.js | head -1 || true
          else
            echo "no existing deployment captured (first run?)"
            : > previous_worker.js
          fi

      - name: Build metadata
        env:
          ADMIN_PASS: ${{ secrets.ADMIN_PASS }}
        run: |
          python3 -c "import json,os;print(json.dumps({'main_module':'index.js','compatibility_date':'2025-11-04','bindings':[{'type':'plain_text','name':'ADMIN','text':os.environ['ADMIN_PASS']},{'type':'kv_namespace','name':'KV','namespace_id':'ebddae875f1942e0b5ce500b66bd956e'}]}))" > meta.json

      - name: Deploy to Cloudflare
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          curl -fsS -X PUT "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/workers/scripts/$WORKER" -H "Authorization: Bearer $CF_API_TOKEN" -F "metadata=@meta.json;type=application/json" -F "index.js=@new_worker.js;type=application/javascript+module;filename=index.js"

      # 关键补强：PUT 返回 2xx 不代表线上字节就是它。之前只有 /login=200 的检查，
      # 老版本同样 200，所以“升级成功”从来没被真正证明过。
      # 实测 CF 的 GET 返回体与上传体相差 183 字节（官方会重写/附加头部），
      # 所以这里比对的是“Version 常量 + 体积差”，而不是逐字节相等。
      - name: Verify deployed bytes
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          curl -fsS "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/workers/scripts/$WORKER" \
            -H "Authorization: Bearer $CF_API_TOKEN" -o deployed_worker.js
          want_ver=$(grep -o "const Version = '[^']*'" new_worker.js | head -1)
          got_ver=$(grep -o "const Version = '[^']*'" deployed_worker.js | head -1)
          want_size=$(wc -c < new_worker.js)
          got_size=$(wc -c < deployed_worker.js)
          echo "expected: $want_size bytes / $want_ver / $(sha256sum new_worker.js | cut -c1-16)"
          echo "deployed: $got_size bytes / $got_ver / $(sha256sum deployed_worker.js | cut -c1-16)"
          echo "--- first difference (byte offset 1-based, then hex of both) ---"
          cmp deployed_worker.js new_worker.js 2>&1 | head -3 || true
          echo "--- deployed head ---"
          head -c 96 deployed_worker.js | od -An -c | head -4
          echo "--- expected head ---"
          head -c 96 new_worker.js | od -An -c | head -4
          if [ "$got_ver" != "$want_ver" ]; then
            echo "::error::deployed Version ($got_ver) != expected ($want_ver)"
            exit 1
          fi
          delta=$(( got_size > want_size ? got_size - want_size : want_size - got_size ))
          if [ "$delta" -gt 4096 ]; then
            echo "::error::deployed size differs by $delta bytes (limit 4096)"
            exit 1
          fi
          echo "OK: deployed Version matches and size delta is $delta bytes"

      - name: Health check
        run: |
          for i in $(seq 1 6); do
            sleep 10
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://$HOST/login" || true)
            sub=$(curl -s "https://$HOST/sub?token=$SUB_TOKEN&b64" | base64 -d | grep -c "vless://" || true)
            echo "try $i: login=$code vless=$sub"
            if [ "$code" = "200" ] && [ "$sub" -gt 0 ]; then
              exit 0
            fi
          done
          echo "::error::health check failed"
          exit 1

      # 回滚用仓库里的 _worker.js（上一版成功上传过的完整源码）。
      # 注意：不能把 CF GET 下来的 previous_worker.js 再 PUT 回去——那份是 CF 规范化后的
      # 产物，PUT 会 400（实测），只适合当对照用的快照。
      - name: Roll back
        if: failure()
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          echo "snapshot for reference: $(wc -c < previous_worker.js) bytes"
          echo "rolling back to repo _worker.js ($(wc -c < _worker.js) bytes, $(grep -o "const Version = '[^']*'" _worker.js | head -1))"
          curl -fsS -X PUT "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/workers/scripts/$WORKER" -H "Authorization: Bearer $CF_API_TOKEN" -F "metadata=@meta.json;type=application/json" -F "index.js=@_worker.js;type=application/javascript+module;filename=index.js"
          for i in $(seq 1 6); do
            sleep 10
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://$HOST/login" || true)
            sub=$(curl -s "https://$HOST/sub?token=$SUB_TOKEN&b64" | base64 -d | grep -c "vless://" || true)
            echo "rollback try $i: login=$code vless=$sub"
            if [ "$code" = "200" ] && [ "$sub" -gt 0 ]; then
              echo "rolled back and healthy"
              exit 0
            fi
          done
          echo "::error::rollback did not become healthy"
          exit 1

      - name: Record deployed version
        if: success()
        run: |
          if cmp -s new_worker.js _worker.js; then exit 0; fi
          cp new_worker.js _worker.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _worker.js
          git commit -m "chore: deploy upstream worker" || true
          git push
