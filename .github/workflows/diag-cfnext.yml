name: diag-cfnext
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Account subdomain
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          echo "== subdomain =="
          curl -sS "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/workers/subdomain" -H "Authorization: Bearer $CF_API_TOKEN" | head -c 500; echo
          echo "== zones =="
          curl -sS "https://api.cloudflare.com/client/v4/zones?per_page=50" -H "Authorization: Bearer $CF_API_TOKEN" | python3 -c "import json,sys;d=json.load(sys.stdin);print('success',d.get('success'));print('errors',d.get('errors'));[print(z['id'],z['name'],z['status']) for z in d.get('result') or []]" || true
          echo "== workers =="
          curl -sS "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/workers/scripts" -H "Authorization: Bearer $CF_API_TOKEN" | python3 -c "import json,sys;d=json.load(sys.stdin);print('success',d.get('success'));print('errors',d.get('errors'));[print(s['id']) for s in d.get('result') or []]" || true
      - name: Probe workers.dev from runner
        run: |
          echo "cfnext: $(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 https://cfnext-worker.yangz1j0923.workers.dev/ || true)"
          echo "bogus:  $(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 https://zzz-nonexistent-98765.yangz1j0923.workers.dev/ || true)"
          echo "body:   $(curl -sS --max-time 15 https://cfnext-worker.yangz1j0923.workers.dev/ || true)"